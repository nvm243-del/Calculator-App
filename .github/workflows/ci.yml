name: Calculator CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check calculator files
        run: |
          test -f index.html
          test -f script.js
          test -f style.css
          echo "All calculator files are present!"